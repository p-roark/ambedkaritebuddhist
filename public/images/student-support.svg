<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D4D9B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7F56D9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Books stack (left side) -->
  <rect x="60" y="180" width="70" height="20" fill="#E8B20E" rx="2"/>
  <rect x="65" y="165" width="60" height="18" fill="#FF6B35" rx="2"/>
  <rect x="70" y="152" width="50" height="16" fill="#2D4D9B" rx="2"/>
  
  <!-- Book pages detail -->
  <line x1="75" y1="165" x2="120" y2="165" stroke="#FFF" stroke-width="2"/>
  <line x1="75" y1="172" x2="120" y2="172" stroke="#FFF" stroke-width="2"/>
  
  <!-- Graduation cap (right side) -->
  <ellipse cx="280" cy="140" rx="35" ry="15" fill="#2D4D9B"/>
  <path d="M 245 140 L 220 110 L 340 110 L 315 140" fill="#E8B20E"/>
  <line x1="280" y1="140" x2="280" y2="165" stroke="#2D4D9B" stroke-width="3"/>
  <circle cx="280" cy="172" r="8" fill="#E8B20E"/>
  
  <!-- Light bulb (center-bottom) for ideas -->
  <circle cx="200" cy="260" r="25" fill="#FFD700" stroke="#FF6B35" stroke-width="2"/>
  <rect x="185" y="285" width="30" height="12" fill="#8B7355" rx="2"/>
  <line x1="180" y1="297" x2="220" y2="297" stroke="#8B7355" stroke-width="2"/>
  <line x1="180" y1="302" x2="220" y2="302" stroke="#8B7355" stroke-width="2"/>
  
  <!-- Rays around lightbulb -->
  <line x1="200" y1="225" x2="200" y2="210" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="260" x2="255" y2="260" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="260" x2="145" y2="260" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <line x1="228" y1="232" x2="238" y2="222" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <line x1="172" y1="288" x2="162" y2="298" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Student figure (left-bottom) -->
  <circle cx="100" cy="310" r="10" fill="#FFF"/>
  <rect x="90" y="325" width="20" height="25" fill="#FFF" rx="2"/>
  
  <!-- Student figure (right-bottom) -->
  <circle cx="300" cy="315" r="10" fill="#FFF"/>
  <rect x="290" y="330" width="20" height="25" fill="#FFF" rx="2"/>
  
  <!-- Top text/banner area -->
  <text x="200" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFF" text-anchor="middle">
    Learn & Grow
  </text>
</svg>