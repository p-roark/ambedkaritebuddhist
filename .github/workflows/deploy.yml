name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - release
      - feat/auth-system

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: pnpm workers:build

      - name: Apply DB migrations (preview)
        if: github.ref != 'refs/heads/release'
        run: pnpm dlx wrangler d1 migrations apply DB --remote

      - name: Apply DB migrations (production)
        if: github.ref == 'refs/heads/release'
        run: pnpm dlx wrangler d1 migrations apply DB-PROD --remote

      - name: Deploy (production — www.ambedkaritebuddhist.org)
        if: github.ref == 'refs/heads/release'
        run: pnpm dlx wrangler deploy

      - name: Deploy (preview — ambedkaritebuddhist-preview.workers.dev)
        if: github.ref != 'refs/heads/release'
        run: pnpm dlx wrangler deploy --name ambedkaritebuddhist-preview
