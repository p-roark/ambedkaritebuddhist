<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#2D4D9B"/>

  <!-- Ashoka Chakra - navy blue wheel on white/gold -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="50" cy="50" r="6" fill="#FFFFFF"/>

  <!-- 24 spokes -->
  <g stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round">
    <line x1="50" y1="44" x2="50" y2="19"/>
    <line x1="50" y1="56" x2="50" y2="81"/>
    <line x1="56" y1="44" x2="68.5" y2="22.8"/>
    <line x1="44" y1="56" x2="31.5" y2="77.2"/>
    <line x1="60.4" y1="47" x2="79.6" y2="35.5"/>
    <line x1="39.6" y1="53" x2="20.4" y2="64.5"/>
    <line x1="62" y1="52" x2="81" y2="51"/>
    <line x1="38" y1="48" x2="19" y2="49"/>
    <line x1="60.4" y1="57" x2="79.6" y2="68.5"/>
    <line x1="39.6" y1="43" x2="20.4" y2="31.5"/>
    <line x1="56" y1="60.5" x2="68.5" y2="82"/>
    <line x1="44" y1="39.5" x2="31.5" y2="18"/>

    <!-- Intermediate spokes at 15° offsets -->
    <line x1="52.6" y1="44.2" x2="59.1" y2="19.8"/>
    <line x1="47.4" y1="55.8" x2="40.9" y2="80.2"/>
    <line x1="57.8" y1="46.2" x2="74.8" y2="27.8"/>
    <line x1="42.2" y1="53.8" x2="25.2" y2="72.2"/>
    <line x1="61.2" y1="50.6" x2="80.2" y2="43.4"/>
    <line x1="38.8" y1="49.4" x2="19.8" y2="56.6"/>
    <line x1="61.2" y1="55.4" x2="78.2" y2="65.6"/>
    <line x1="38.8" y1="44.6" x2="21.8" y2="34.4"/>
    <line x1="57.8" y1="59.8" x2="72.8" y2="77.8"/>
    <line x1="42.2" y1="40.2" x2="27.2" y2="22.2"/>
    <line x1="52.6" y1="61.8" x2="57.6" y2="80.4"/>
    <line x1="47.4" y1="38.2" x2="42.4" y2="19.6"/>
  </g>
</svg>
